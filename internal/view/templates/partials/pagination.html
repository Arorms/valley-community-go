{{define "pagination"}}
{{if gt .TotalPages 1}}
<nav class="mt-5 flex items-center justify-between text-[12px] text-muted-foreground">
  {{if gt .PageNo 1}}
  <a href="?page={{sub .PageNo 1}}" class="rounded-full border border-border bg-card px-3 py-1.5 transition hover:bg-muted">上一页</a>
  {{else}}
  <span class="rounded-full border border-transparent px-3 py-1.5 opacity-40">上一页</span>
  {{end}}
  <span>第 {{.PageNo}} / {{.TotalPages}} 页</span>
  {{if lt .PageNo .TotalPages}}
  <a href="?page={{add .PageNo 1}}" class="rounded-full border border-border bg-card px-3 py-1.5 transition hover:bg-muted">下一页</a>
  {{else}}
  <span class="rounded-full border border-transparent px-3 py-1.5 opacity-40">下一页</span>
  {{end}}
</nav>
{{end}}
{{end}}
