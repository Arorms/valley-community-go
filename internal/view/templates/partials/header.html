{{define "header"}}
<header class="sticky top-0 z-20 flex h-[56px] items-center justify-between gap-3 border-b border-border bg-background/80 px-4 backdrop-blur-xl lg:px-8">
  <div class="flex min-w-0 items-center gap-2">
    <button id="menu-toggle" type="button" title="打开菜单" aria-label="打开菜单" class="rounded-lg p-2 text-muted-foreground transition hover:bg-muted hover:text-foreground lg:hidden">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="truncate text-[13px] font-medium text-muted-foreground">{{.Title}}</span>
  </div>

  <div class="flex items-center gap-1.5">
    <button id="theme-toggle" type="button" title="切换主题" aria-label="切换主题" class="rounded-lg p-2 text-muted-foreground transition hover:bg-muted hover:text-foreground">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>

    {{if .User}}
    <a href="/notifications" title="通知" class="relative rounded-lg p-2 text-muted-foreground transition hover:bg-muted hover:text-foreground">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>
      {{if gt .Unread 0}}<span class="absolute -right-0.5 -top-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-danger px-1 text-[10px] font-medium text-white">{{.Unread}}</span>{{end}}
    </a>
    <a href="/posts/new" class="hidden items-center gap-2 rounded-full bg-primary px-4 py-2 text-[13px] font-medium text-primary-foreground shadow-sm transition hover:bg-primary/90 sm:inline-flex">发帖</a>
    <a href="/users/{{.User.Username}}" class="ml-1 rounded-full" title="个人资料">{{template "avatar" .User}}</a>
    {{else}}
    <a href="/auth/login" class="inline-flex items-center rounded-full bg-primary px-4 py-2 text-[13px] font-medium text-primary-foreground shadow-sm transition hover:bg-primary/90">登录</a>
    {{end}}
  </div>
</header>
{{end}}
