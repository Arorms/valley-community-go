{{define "avatar"}}
{{if .AvatarURL}}
<img src="{{.AvatarURL}}" alt="" class="h-8 w-8 shrink-0 rounded-full object-cover ring-1 ring-border">
{{else}}
<span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-foreground text-[12px] font-medium text-background">{{.Initials}}</span>
{{end}}
{{end}}
