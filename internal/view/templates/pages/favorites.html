<!DOCTYPE html>
<html lang="zh-CN">
<head>{{template "head" .}}</head>
<body class="min-h-screen bg-background text-foreground">
{{template "sidebar" .}}
<div class="lg:pl-[240px]">
  {{template "header" .}}
  <main class="mx-auto w-full max-w-[1100px] px-4 py-6 lg:px-8 lg:py-8">
    {{template "flash" .}}
    <div class="mb-5">
      <h1 class="text-[22px] font-semibold leading-tight">我的收藏</h1>
      <p class="mt-1 text-[13px] text-muted-foreground">共 {{.Total}} 篇帖子</p>
    </div>

    {{if .Posts}}
    <div class="space-y-3">
      {{range .Posts}}{{template "post_card" .}}{{end}}
    </div>
    {{template "pagination" .}}
    {{else}}
    <div class="rounded-[var(--radius)] border border-border bg-card p-10 text-center shadow-[0_1px_2px_rgba(0,0,0,0.04),0_4px_12px_rgba(0,0,0,0.03)] dark:shadow-none">
      <p class="text-[13px] text-muted-foreground">还没有收藏任何帖子。</p>
      <a href="/" class="mt-3 inline-flex items-center rounded-full bg-primary px-4 py-2 text-[13px] font-medium text-primary-foreground transition hover:bg-primary/90">去逛逛</a>
    </div>
    {{end}}
  </main>
</div>
{{template "footer" .}}
</body>
</html>
